[job]
dump_folder = "./outputs/qwen_test"
description = "Qwen 3 small model training on test dataset"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 100

[metrics]
log_freq = 10
enable_tensorboard = false
enable_wandb = true
save_tb_folder = "tb"

[model]
name = "qwen3"
flavor = "width_256"
hf_assets_path = "./assets/hf/Qwen3-0.6B"

[optimizer]
name = "AdamW"
lr = 3e-4
eps = 1e-8
weight_decay = 0.1

[lr_scheduler]
warmup_steps = 100 # ~4% of 2480 steps
decay_type = "cosine"
min_lr_factor = 0.1

[training]
local_batch_size = 4 # works for 40GB A100, if 80GB, try 8
global_batch_size = 128  # Safe baseline for 60M model 
seq_len = 4096
max_norm = 1.0
steps = 2480  # Chinchilla optimal: 1.3B tokens / (128 batch * 4096 seq_len) = 2480 steps
enable_cpu_offload = false
dataset = "fineweb_edu"
dtype = "bfloat16"

[parallelism]
data_parallel_replicate_degree = 2  # Assuming 4 GPUs for test, adjust as needed
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default"
tensor_parallel_degree = 1
context_parallel_degree = 1

[checkpoint]
enable = true
folder = "checkpoint"
interval = 500
keep_latest_k = 10
last_save_model_only = false
export_dtype = "bfloat16"
async_mode = "disabled"

[activation_checkpoint]
mode = "selective"
selective_ac_option = "op"

[compile]
enable = true
components = ["model", "loss"]

[quantize.linear.float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output"]
