[job]
dump_folder = "./outputs"
description = "Qwen 3 0.6B training"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 100

[metrics]
log_freq = 1
enable_tensorboard = false
enable_wandb = true
save_tb_folder = "tb"

[model]
name = "qwen3"
flavor = "0.6B"
hf_assets_path = "./assets/hf/Qwen3-0.6B-Base"
# converters = ["float8"]

[optimizer]
name = "AdamW"
lr = 1e-5
eps = 1e-8

[lr_scheduler]
warmup_steps = 2  # lr scheduler warm up, 20% total steps

[training]
# local_batch_size = 4
local_batch_size = 1
global_batch_size = 4  # Accumulate gradients over 4 micro-batches
steps = 12207          # 200M / (4 × 4096) = 12,207 steps
seq_len = 4096
max_norm = 1.0  # grad norm clipping
dataset = "wikitext"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
fsdp_reshard_after_forward = "default" # default / never / always
tensor_parallel_degree = 1
context_parallel_degree = 1

[checkpoint]
enable = true
folder = "checkpoint"
interval = 500
enable_first_step_checkpoint = true # for sanity check
initial_load_path = "./assets/hf/Qwen3-0.6B-Base"
initial_load_in_hf = true
initial_load_model_only = true
last_save_model_only = false
export_dtype = "float16"
async_mode = "async" # ["disabled", "async", "async_with_pinned_mem"]

[activation_checkpoint]
mode = "selective"  # ["none", "selective", "full"]
selective_ac_option = "op"  # "int" = ac every positive int layer or 'op', ac based on ops policy

[compile]
enable=false
components = ["model", "loss"]

[quantize.linear.float8]
enable_fsdp_float8_all_gather = false
precompute_float8_dynamic_scale_for_fsdp = false
filter_fqns = ["output"]

[dispersion]
variant = "l2_repel"
dispersion_coeff = 5.0
dispersion_loc = "all"
tau_l2 = 0.5
tau_cos = 0.5
