[job]
dump_folder = "./outputs"
description = "GPT-2 debug training"

[model]
name = "gpt2"
flavor = "debugmodel"

[optimizer]
name = "AdamW"
lr = 3e-4

[training]
batch_size = 4
seq_len = 512
steps = 100
dataset = "c4"
compiled_autograd = false

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1

[checkpoint]
enable = false

[activation_checkpoint]
mode = "none"

[compile]
enable = false


